services:
  runpaceflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: runpaceflow
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
      - RUNPACEFLOW_ADMIN_URL=http://127.0.0.1:3030
      - RUNPACEFLOW_ADMIN_API_TOKEN=${RUNPACEFLOW_ADMIN_API_TOKEN:?set RUNPACEFLOW_ADMIN_API_TOKEN}
      - NEXT_PUBLIC_MAP_STYLE=https://basemaps.cartocdn.com/gl/positron-gl-style/style.json
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
